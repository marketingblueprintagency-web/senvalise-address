<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirm your delivery address · Senvalise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#14232b;--muted:#5b6b72;--line:#d5dedd;--accent:#0b6e6e;--accent-ink:#fff;--err:#c0392b;--ok:#2f9e57;
--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"Figtree","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d171c;--surface:#162329;--ink:#e9f1ef;--muted:#93a7ab;--line:#28393f;--accent:#3fb5ae;--accent-ink:#072124;--err:#ef7a6c;--ok:#3fb871;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.card{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
.brand{font:700 22px var(--fd);letter-spacing:-.01em;margin-bottom:20px}
h1{font:700 clamp(24px,5vw,30px)/1.15 var(--fd);margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px}
.order{display:inline-block;background:var(--bg);border-radius:8px;padding:2px 10px;font-weight:600}
form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}.card{padding:24px 18px}}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
label small{font-weight:400;color:var(--muted);font-size:13px}
input,select{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[aria-invalid=true]{border-color:var(--err)}
.err{color:var(--err);font-size:13px;font-weight:500;min-height:0}
button{font:600 16px var(--fb);background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 20px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.note{color:var(--muted);font-size:13px;margin:0}
.msg{border-radius:12px;padding:14px 16px;font-size:15px}
.msg.bad{background:color-mix(in srgb,var(--err) 12%,transparent);border:1px solid var(--err)}
.done{text-align:left}
.done .tick{width:48px;height:48px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:16px}
.addr{white-space:pre-line;background:var(--bg);border-radius:10px;padding:12px 14px;margin:16px 0;font-weight:500}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Senvalise</div>

  <section id="formView">
    <h1>Confirm your delivery address</h1>
    <p class="sub">Please fill in your full details so we can send your order without delays.</p>
    <div id="top" class="msg bad" role="alert" hidden></div>
    <form id="f" novalidate>
      <label>Email address
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="err" id="e-email"></span>
      </label>
      <label>Recipient's full name
        <input id="name" name="name" autocomplete="name" required>
        <span class="err" id="e-name"></span>
      </label>
      <label>Phone number <small>Adding a phone number increases the chance of a successful delivery.</small>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        <span class="err" id="e-phone"></span>
      </label>
      <label>Street and house number
        <input id="addr1" name="addr1" autocomplete="address-line1" required>
        <span class="err" id="e-addr1"></span>
      </label>
      <label>Apartment, suite, etc. <small>(optional)</small>
        <input id="addr2" name="addr2" autocomplete="address-line2">
      </label>
      <div class="row">
        <label>Postcode
          <input id="zip" name="zip" autocomplete="postal-code" required>
          <span class="err" id="e-zip"></span>
        </label>
        <label>City
          <input id="city" name="city" autocomplete="address-level2" required>
          <span class="err" id="e-city"></span>
        </label>
      </div>
      <label>Country
        <input id="country" name="country" autocomplete="country-name" required>
        <span class="err" id="e-country"></span>
      </label>
      <div class="hp" aria-hidden="true"><label>Leave empty<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
      <button id="go" type="submit">Confirm my address</button>
    </form>
  </section>

  <section id="doneView" class="done" hidden aria-live="polite">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Thank you, we received your address</h1>
    <div class="addr" id="addrOut"></div>
    <p class="sub" id="doneMsg">We are processing it now and will email you within 2 days with an update.</p>
  </section>
</main>

<script>
(function(){
  // Where the form is sent (ProDash edge function). Until it is live, details only go to Klaviyo.
  var ENDPOINT = "https://mvbtjgttzcijzddmwxjl.supabase.co/functions/v1/address-confirm";
  var KLAVIYO_COMPANY_ID = "";
  var METRIC = "Address Submitted";

  var $ = function(id){return document.getElementById(id)};
  var q = new URLSearchParams(location.search);
  var order = (q.get("o")||"").replace(/[^0-9]/g,"");
  var email = (q.get("e")||"").trim();
  if(email){ $("email").value = email; }

  var rules = {
    email:   function(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || "Enter the email address you used for your order."; },
    name:    function(v){ return v.trim().split(/\s+/).length >= 2 || "Enter first and last name."; },
    phone:   function(v){ return v.replace(/[^0-9]/g,"").length >= 7 || "Enter a phone number with country code."; },
    addr1:   function(v){ return (/\d/.test(v) && v.trim().length >= 5) || "Include street name and house number."; },
    zip:     function(v){ return v.trim().length >= 3 || "Enter your postcode."; },
    city:    function(v){ return v.trim().length >= 2 || "Enter your city."; },
    country: function(v){ return v.trim().length >= 2 || "Enter your country."; }
  };

  function validate(){
    var ok = true, first = null;
    Object.keys(rules).forEach(function(k){
      var el = $(k), r = rules[k](el.value), err = $("e-"+k);
      if(r === true){ el.removeAttribute("aria-invalid"); err.textContent = ""; }
      else { ok = false; el.setAttribute("aria-invalid","true"); err.textContent = r; if(!first) first = el; }
    });
    if(first) first.focus();
    return ok;
  }

  function showTop(t){ var b = $("top"); b.textContent = t; b.hidden = !t; if(t) b.scrollIntoView({behavior:"smooth",block:"center"}); }

  function klaviyo(p){
    if(!KLAVIYO_COMPANY_ID) return Promise.resolve();
    return fetch("https://a.klaviyo.com/client/events/?company_id=" + KLAVIYO_COMPANY_ID, {
      method:"POST", headers:{"Content-Type":"application/json", revision:"2024-10-15"},
      body: JSON.stringify({data:{type:"event",attributes:{
        properties:p,
        metric:{data:{type:"metric",attributes:{name:METRIC}}},
        profile:{data:{type:"profile",attributes:{email:p.email}}}
      }}})
    });
  }

  $("f").addEventListener("submit", function(ev){
    ev.preventDefault(); showTop("");
    if($("website").value) return;                     // honeypot
    if(!validate()) return;
    var p = {
      order_number: order, email: $("email").value.trim().toLowerCase(),
      name: $("name").value.trim(), phone: $("phone").value.trim(),
      address1: $("addr1").value.trim(), address2: $("addr2").value.trim(),
      zip: $("zip").value.trim(), city: $("city").value.trim(), country: $("country").value.trim()
    };
    var btn = $("go"); btn.disabled = true; btn.textContent = "Sending…";

    var step = ENDPOINT
      ? fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(p)})
          .then(function(r){ return r.json().catch(function(){return {}}).then(function(j){ return {ok:r.ok, j:j}; }); })
      : Promise.resolve({ok:true, j:{status:"received"}});

    step.then(function(res){
      if(!res.ok){
        btn.disabled = false; btn.textContent = "Confirm my address";
        showTop(res.j && res.j.message ? res.j.message : "We could not find an order for this email address. Please check it and try again.");
        return;
      }
      p.status = (res.j && res.j.status) || "received";   // received | updated | too_late
      klaviyo(p).catch(function(){}).then(function(){
        var out = [p.name, p.address1 + (p.address2 ? ", " + p.address2 : ""), p.zip + " " + p.city, p.country, p.phone].join("\n");
        $("addrOut").textContent = out;
        $("doneMsg").textContent = p.status === "too_late"
          ? "Your order has already been handed to the carrier, so the address can no longer be changed. We will email you shortly."
          : "We are processing it now and will email you within 2 days with an update.";
        $("formView").hidden = true; $("doneView").hidden = false; window.scrollTo({top:0,behavior:"smooth"});
      });
    }).catch(function(){
      btn.disabled = false; btn.textContent = "Confirm my address";
      showTop("Something went wrong. Please try again in a moment.");
    });
  });
})();
</script>
</body>
</html>
